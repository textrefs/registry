work:
  key: plato.republic
  preferred_label: Republic
  status: draft
  created: 2026-05-31
  modified: 2026-08-12
  creators:
    - kind: person
      family: Plato

citation_system: stephanus

mappings:
  - relation: alternateOf
    conforms_to: 'https://www.wikidata.org/'
    identifier: 'https://www.wikidata.org/entity/Q123397'
    source: manual-curation
    status: draft
    created: 2026-05-31
    modified: 2026-08-11
  - relation: isReferencedBy
    conforms_to: 'https://en.wikipedia.org/'
    identifier: 'https://en.wikipedia.org/wiki/Republic_(Plato)'
    source: 'wikidata:Q123397'
    status: draft
    created: 2026-06-02
    modified: 2026-08-11

resolvers:
  - provider: Perseus Digital Library
    edition: 'Plato, Republic (Burnet, OCT)'
    language: grc
    access: open
    license: CC-BY-SA-3.0
    license_url: 'https://www.perseus.tufts.edu/hopper/opensource'
    # Perseus accepts the short citation form "Plat. Rep. {page}{section}" in
    # the `doc` query. Sub-line is not addressable; resolver lands on the
    # Stephanus section.
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Plat.+Rep.+{page}{section}'
    last_checked: '2026-06-03'

# No second resolver. The Perseus canonical-greekLit edition exposes only
# integer Stephanus pages under a book prefix (no `a`–`e` section letter), so a
# Scaife CTS URN cannot be derived from the Stephanus locator without losing the
# section; and a translation with no Stephanus anchor would resolve all 1,475
# references to the same landing page, which tells a reader less than no link.

# Republic spans 327a–621d; all five sections per page → 1,475 references.
references_range:
  - kind: stephanus
    page_range: [327, 621]
