work:
  key: nietzsche.vermischte-meinungen
  preferred_label: Vermischte Meinungen und Sprüche
  alternative_labels:
    - 'VM'
    - 'Assorted Opinions and Maxims'
    - 'MA II/1'
  status: draft
  created: 2026-08-26
  modified: 2026-08-26
  creators:
    - kind: person
      family: Nietzsche
      given: Friedrich

citation_system: integer-section

# No mappings at all, and both absences were checked rather than assumed.
#
# Wikidata: a SPARQL query for every work with author = Q9358 (Friedrich
# Nietzsche) returns no separate item for this title. Wikidata treats it only as
# part of Menschliches, Allzumenschliches II, so mapping it to the parent would
# assert something false about what the target denotes (ADR-0006).
#
# Wikipedia: no article exists in either language. Checked 2026-08-26 —
# en.wikipedia.org/wiki/Assorted_Opinions_and_Maxims and the German title both
# return HTTP 404.
#
# The work is cited on its own siglum (VM) in the scholarship and resolves on
# its own, so it is registered without mappings rather than mismapped.

resolvers:
  - provider: Nietzsche Source
    edition: 'Digitale Kritische Gesamtausgabe (eKGWB), ed. Colli/Montinari (KGW/KSA)'
    language: de
    access: open
    # The siglum is a per-work constant; the aphorism number is the locator.
    # The path form is server-validated: a siglum-number pair that does not
    # exist returns a real HTTP 404, so this resolver can be link-checked.
    url: 'https://www.nietzschesource.org/eKGWB/VM-{section}'
    last_checked: '2026-08-26'

# Extent found on 2026-08-26 by binary search against the provider's own 404s,
# then confirmed at the boundary: VM-408 resolves and VM-409 returns 404.
references_range:
  - kind: integer
    from: 1
    to: 408
