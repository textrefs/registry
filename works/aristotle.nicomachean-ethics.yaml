    source: 'wikidata:Q474537'
    status: draft
    created: 2026-06-02
    modified: 2026-08-11

resolvers:
  - provider: Perseus Digital Library
    edition: 'Aristotle, Nicomachean Ethics, tr. H. Rackham (Loeb, 1934)'
    language: en
    access: open
    license: CC-BY-SA-3.0
    license_url: 'https://www.perseus.tufts.edu/hopper/opensource'
    # Perseus accepts the short citation form "Aristot. Nic. Eth. {page}{column}"
    # in the `doc` query; lands on the Bekker column. Line is not addressable.
    # The short form serves Rackham's English translation, not the Greek; the
    # Greek edition is the second entry below.
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Aristot.+Nic.+Eth.+{page}{column}'
    last_checked: '2026-08-25'
  - provider: Perseus Digital Library
    edition: 'Aristotle, Ethica Nicomachea, ed. J. Bywater (OCT, 1894)'
    language: grc
    access: open
    license: CC-BY-SA-3.0
    license_url: 'https://www.perseus.tufts.edu/hopper/opensource'
    # The long `doc` form addresses the Greek OCT text by Bekker page and
    # column. The literal space in "bekker page" must stay percent-encoded.
    # Checked 2026-08-25: `1094a` → πᾶσα τέχνη …, `1172a` → the discussion of
    # pleasure. Control: `9999z` → "No document found", so bad input is
    # rejected.
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0053:bekker%20page={page}{column}'
    last_checked: '2026-08-25'

# No Scaife resolver. The edition Scaife hosts for this work
# (tlg0086.tlg010.perseus-grc2) is cited by book and chapter, not by Bekker
# page. Scaife serves the last chunk of the work for any passage it cannot
# parse, so a {page}{column} template would silently resolve everything to the
# discussion of pleasure in Book X at HTTP 200. Checked 2026-08-25: `:1094a`,
# `:1094a1` and `:10.1` all return the text of 1172a. Revisit if Scaife
# ingests perseus-eng1, which IS cited by Bekker.

# Page ranges by book: I 1094a–1103a, II 1103a–1109b, III 1109b–1119b,
# IV 1119b–1128b, V 1129a–1138b, VI 1138b–1145a, VII 1145a–1154b,
# VIII 1155a–1163b, IX 1163b–1170a, X 1172a–1181b. Lines 1–30 per column
# → ~5,220 references.
references_range:
  - kind: bekker
    page_ranges:
      - [1094, 1103]
      - [1103, 1109]
      - [1109, 1119]
      - [1119, 1128]
      - [1129, 1138]
      - [1138, 1145]
      - [1145, 1154]
      - [1155, 1163]
      - [1163, 1170]
      - [1172, 1181]
    lines_per_column: 30
