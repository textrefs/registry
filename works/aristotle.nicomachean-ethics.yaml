# No second resolver. The Perseus canonical-greekLit edition is indexed by
# Bywater book.section, not Bekker page+column, so a Scaife CTS URN cannot be
# derived from a Bekker locator alone; and a translation with no Bekker anchor
# would resolve every one of the ~5,220 references to the same landing page,
# which tells a reader less than no link at all.

# Page ranges by book: I 1094a–1103a, II 1103a–1109b, III 1109b–1119b,
# IV 1119b–1128b, V 1129a–1138b, VI 1138b–1145a, VII 1145a–1154b,
# VIII 1155a–1163b, IX 1163b–1170a, X 1172a–1181b. Lines 1–30 per column
# → ~5,220 references.
references_range:
  - kind: bekker
    page_ranges:
      - [1094, 1103]
      - [1103, 1109]
      - [1109, 1119]
      - [1119, 1128]
      - [1129, 1138]
      - [1138, 1145]
      - [1145, 1154]
