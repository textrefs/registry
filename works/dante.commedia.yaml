resolvers:
  - provider: Princeton Dante Project
    edition: 'Princeton Dante Project (2.0)'
    language: it
    access: open
    # The CGI addresses a single verse: INP_START is the starting line and
    # INP_LEN=1 selects one. LANG=1 is the Italian text. The cantica vocabulary
    # Inf/Purg/Par is the locator's own vocabulary, so no mapping is needed.
    #
    # Checked 2026-08-26 with cross-controls: Inf.1.1 -> "Nel mezzo del cammin
    # di nostra vita"; Inf.5.121 -> "Nessun maggior dolore"; Par.33.145 ->
    # "l'amor che move il sole e l'altre stelle." The Inf.1.1 page contains no
    # occurrence of Inf.5.121's text and vice versa.
    #
    # CAUTION for link checking: an invalid canto or verse returns HTTP 200
    # with an 854-byte error page that leaks a raw SQL string, not a 4xx. A
    # status-code check will pass a bad URL here. Check the body. The resolver
    # does not serve the wrong passage, which is the failure that matters.
    #
    # This is a small academic server. Pace any automated checking; ~20 rapid
    # requests were enough to make it start refusing connections.
    url: 'https://dante.princeton.edu/cgi-bin/dante/campuscgi/mpb/GetCantoSection.pl?INP_POEM={cantica}&INP_SECT={canto}&INP_START={verse}&INP_LEN=1&LANG=1'
    last_checked: '2026-08-26'

# No Dante Lab resolver. dantelab.dartmouth.edu presents a TLS certificate for
# CN=*.herokuapp.com, which does not match the hostname, so HTTPS fails and only
# plaintext HTTP works — the same disqualifier recorded for wittgensteinsource.org.
# Its reader also stops at the canto and takes no verse parameter. Checked
# 2026-08-26.
#
# No Dartmouth Dante Project resolver. search_view.php accepts cantica, canto and
# line, but every request answers "Your session has timed out" (67 bytes), with
# and without an established cookie jar. It is not deep-linkable, and it serves
# commentaries rather than the poem. Checked 2026-08-26.

# Verse counts per canto, harvested from the Princeton Dante Project on
# 2026-08-26 by requesting each canto with INP_LEN=250 and reading the highest
# verse number returned.
#
# Independently confirmed: Inferno 4,720 + Purgatorio 4,755 + Paradiso 4,758 =
# 14,233, the canonical line count of the Commedia. An earlier harvest that had
# been silently degraded by rate limiting summed to 13,939 and was discarded.
