resolvers:
  - provider: Hume Texts Online
    edition: 'Hume Texts Online, ed. Peter Millican (Hertford College, Oxford)'
    language: en
    access: open
    # Per-section pages with a per-paragraph anchor. The site prints each
    # paragraph's own citation ("T 1.3.6.4, SBN 88-9"), so the anchor and the
    # locator agree by construction. Checked 2026-08-26; controls
    # `/texts/t/9/9/9` and `/texts/zzz/1` return a real HTTP 404.
    url: 'https://davidhume.org/texts/t/{book}/{part}/{section}#{paragraph}'
    last_checked: '2026-08-26'

# Structure and paragraph counts harvested from Hume Texts Online on
# 2026-08-26 by walking `/texts/t/{book}/{part}/{section}` until the site
# returned 404, then reading the highest paragraph anchor on each page.
# Result: 3 books, 10 parts, 90 sections, 1,213 paragraphs — the canonical
# shape of the Treatise (I.i-iv, II.i-iii, III.i-iii).
#
# Two sections are genuinely tiny and were checked by hand rather than
# assumed: T 1.1.2 has exactly one paragraph (id 2 absent) and T 3.2.4 has
# exactly two (id 3 absent).
#
# One `book_chapter_verse` block per book-and-part, with the `book` field
# carrying the `{book}.{part}` prefix, so the expansion emits
# `book.part.section.paragraph` directly.
