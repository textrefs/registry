resolvers:
  - provider: STEP Bible
    edition: SBL Greek New Testament
    language: grc
    access: open
    license: CC-BY-4.0
    license_url: 'https://sblgnt.com/license/'
    url: 'https://www.stepbible.org/?q=version=SBLG%7Creference={book}.{chapter}.{verse}'
    last_checked: '2026-06-03'

  - provider: Deutsche Bibelgesellschaft
    edition: 'Nestle-Aland, Novum Testamentum Graece, 28th edn (NA28)'
    language: grc
    access: open
    # Free to read, no registration; the Greek text is served in full. Not an
    # open licence, so no `license` is recorded.
    license_url: 'https://www.die-bibel.de/impressum'
    # die-bibel.de addresses books by USFM code (`JHN`), not by the OSIS code
    # the locator carries (`John`), so the spelling is mapped per resolver.
    # An unknown code silently renders Matthäus 1 rather than erroring, so
    # every entry below was checked against the rendered chapter title.
    vars:
      bookUsfm:
        from: book
        map:
          Matt: MAT
          Mark: MRK
          Luke: LUK
          John: JHN
          Acts: ACT
          Rom: ROM
          1Cor: 1CO
          2Cor: 2CO
          Gal: GAL
          Eph: EPH
          Phil: PHP
          Col: COL
          1Thess: 1TH
          2Thess: 2TH
          1Tim: 1TI
          2Tim: 2TI
          Titus: TIT
          Phlm: PHM
          Heb: HEB
          Jas: JAS
          1Pet: 1PE
          2Pet: 2PE
          1John: 1JN
          2John: 2JN
          3John: 3JN
          Jude: JUD
          Rev: REV
    url: 'https://www.die-bibel.de/bibel/NA28/{bookUsfm}.{chapter}/#{bookUsfm}.{chapter}.{verse}'
    last_checked: '2026-08-12'

# The Wikisource King James Version resolver was removed: en.wikisource.org
# migrated most books to one continuous page each, so `.../{Book}/Chapter_{n}`
# 404s for 26 of the 27 books, and the surviving `#{verse}` anchors are not
# unique within a page.

# Verse counts per chapter for all 27 books, derived from the SBLGNT
# (morphgnt/sblgnt) — the edition the STEP Bible resolver serves. Each entry is
# the HIGHEST verse number in that chapter, not the number of verses printed:
# SBLGNT omits verses traditional numbering reserves (Matt 17:21, John 5:4, the
# bracketed pericope adulterae), and those numbers are still cited. 7,953
# references in total.
