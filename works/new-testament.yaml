  preferred_label: New Testament
  status: draft
  created: 2026-05-31
  modified: 2026-08-12

citation_system: bible-book-chapter-verse

mappings:
  - relation: alternateOf
    conforms_to: 'https://www.wikidata.org/'
    identifier: 'https://www.wikidata.org/entity/Q18813'
    source: manual-curation
    status: draft
    created: 2026-05-31
    modified: 2026-08-11
  - relation: isReferencedBy
    conforms_to: 'https://en.wikipedia.org/'
